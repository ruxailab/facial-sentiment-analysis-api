# Deploy Facial Sentiment Analysis API to Cloud Run (production).
# Triggered on push to main.

name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "routes/**"
      - "services/**"
      - "utils/**"
      - "schemas/**"
      - "models/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "poetry.lock"

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  Deploy:
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      project_id: ruxailab-prod
      region: us-central1
      repo: containers
      image: facial-sentiment-analysis-api
      service: facial-sentiment-analysis-api
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_PROD }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET_PROD }}
